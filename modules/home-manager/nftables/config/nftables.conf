#!/usr/sbin/nft -f

flush ruleset

define VPN_SUBNET   = 10.8.0.0/24
define LAN_SUBNET   = 192.168.0.0/24
define CAMERA_IP    = 192.168.0.34
define WHITELIST    = { }
# Útil si abres 80/443 en el router: mete aquí IPs fijas
# (oficina, familia...) para que accedan a servicios
# management sin necesidad de VPN.

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop

    ct state established,related accept
    iif lo accept
    iifname { "docker0", "br-*" } accept
    ip protocol icmp icmp type echo-request accept

    # PÚBLICO
    tcp dport { 80, 443 } accept
    udp dport 51820 accept

    # LAN + VPN + WHITELIST
    ip saddr { $LAN_SUBNET, $VPN_SUBNET, $WHITELIST } tcp dport {
      22,     # SSH
      5900,   # VNC
      8123,   # Home Assistant
      5000,   # Frigate
      1984,   # go2rtc API
      51821,  # WireGuard UI
      9090,   # Prometheus
      3001,   # Grafana
      9443,   # Portainer
      4096,   # opencode
      9101,   # network-exporter
      8053,   # Pi-hole direct
    } accept

    # Streaming video (go2rtc)
    ip saddr { $LAN_SUBNET, $VPN_SUBNET } tcp dport { 8554, 8555 } accept
    ip saddr { $LAN_SUBNET, $VPN_SUBNET } udp dport { 8554, 8555 } accept

    # CÁMARA CATEYE
    ip saddr $CAMERA_IP tcp dport 18999 accept
    ip saddr $CAMERA_IP udp dport 6667 accept

    # MQTT INTERNO
    tcp dport 1883 ip saddr 127.0.0.0/8 accept

    log prefix "nftables-denied: " drop
  }

  chain forward {
    type filter hook forward priority 0; policy accept
  }

  chain output {
    type filter hook output priority 0; policy accept
  }
}
