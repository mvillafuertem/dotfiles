#!/usr/sbin/nft -f

# OJO: nada de 'flush ruleset' — borraría las reglas que Docker,
# WireGuard y Traefik insertan por su cuenta y te deja sin internet/VPN.
# Aquí solo gestionamos nuestra propia tabla.
table inet filter
delete table inet filter

define VPN_SUBNET = 10.8.0.0/24
define LAN_SUBNET = 192.168.0.0/24

# --------------------------------------------------------------------
# AVISO sobre Docker y este firewall:
#
# Este firewall SOLO controla el tráfico que pasa por la pila de red
# del propio Pi. Eso cubre:
#   - servicios del host (sshd, VNC...)
#   - contenedores con `network_mode: host` (p.ej. Traefik)
#
# Los contenedores normales que publican puerto con `-p` (ej.
# `ports: ["9000:9000"]` en compose) NO pasan por estas reglas:
# Docker inserta sus propias reglas en el kernel y se salta este
# `policy drop`. Si publicas en 0.0.0.0 quedará abierto a internet
# aunque aquí solo permitamos LAN/VPN.
#
# Para limitarlos hay que hacerlo en el propio compose, atando el
# puerto a una interfaz concreta:
#   ports:
#     - "127.0.0.1:9000:9000"     # solo local
#     - "192.168.0.10:9000:9000"  # solo en la IP de LAN del Pi
#
# >>> NOTA PARA LA IA QUE EDITE ESTE FICHERO <<<
# Antes de cambiar nada, revisa qué contenedores están corriendo y
# CÓMO publican sus puertos:
#     docker ps --format 'table {{.Names}}\t{{.Ports}}'
# Distingue:
#   - network=host  -> el puerto SÍ lo gobierna este firewall;
#                      asegúrate de no romper su acceso desde LAN/VPN.
#   - 0.0.0.0:PORT  -> EXPUESTO a internet por Docker, este firewall
#                      NO lo protege; avisa al usuario y propón atarlo
#                      a 127.0.0.1 o a la IP de LAN en el compose.
#   - 127.0.0.1:PORT-> solo local, sin riesgo externo.
# NUNCA añadas 'flush ruleset': borraría las reglas de Docker/WG/Traefik
# y deja el Pi sin internet y sin VPN.
# --------------------------------------------------------------------

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    # Tráfico desde los contenedores Docker (bridge) hacia el host
    iifname { "docker0", "br-*" } accept

    # Ping
    ip protocol icmp icmp type echo-request accept

    # Handshake de WireGuard desde internet (necesario para CONECTAR la VPN)
    udp dport 51820 accept

    # Todo lo demás SOLO desde LAN y VPN.
    # Cubre SSH, VNC, Traefik (80/443) y TODOS los contenedores
    # network=host, sin tener que mantener una lista de puertos.
    ip saddr { $LAN_SUBNET, $VPN_SUBNET } accept

    log prefix "nft-drop: " drop
  }

  chain forward {
    type filter hook forward priority 0; policy accept
  }

  chain output {
    type filter hook output priority 0; policy accept
  }
}
