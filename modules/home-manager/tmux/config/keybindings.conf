# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Windows & splits (inherit current path)
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind  x  setw synchronize-panes

# Pane detach / attach
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.1
bind-key S choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'

# Session navigation
bind -n C-Tab   switch-client -n
bind -n C-S-Tab switch-client -p
bind s choose-tree -Zs -O name
bind w choose-tree -Zw -O name

# C-k passthrough (consumed by vim-tmux-navigator otherwise)
unbind C-k
bind C-k send-key C-k

# VPN: crea sesión `vpn` si falta y manda el alias
bind v run-shell "tmux has-session -t vpn 2>/dev/null || tmux new-session -d -s vpn; tmux send-keys -t vpn vpn Enter" \; switch-client -t vpn

# K: fuzzy k9s context picker (only on hosts with the script)
bind K if-shell -b "test -f ~/.config/tmux/k9s-context-menu.sh" \
  "display-popup -E -w 60% -h 40% -T \" k9s context \" \"bash ~/.config/tmux/k9s-context-menu.sh\""

# P: fuzzy project picker over ~/gbg (only on hosts with the script)
bind P if-shell -b "test -f ~/.config/tmux/project-picker.sh" \
  "display-popup -E -w 60% -h 60% -T \" projects \" \"bash ~/.config/tmux/project-picker.sh\""

# Copy-mode vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
