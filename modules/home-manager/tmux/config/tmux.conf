# default-shell / default-command are appended by Nix (see default.nix)
# pointing to ${pkgs.bashInteractive}/bin/bash in the nix store.

# Plugin declarations must live here so TPM can scan this file
set -g @plugin 'tmux-plugins/tpm#master'
set -g @plugin 'catppuccin/tmux#v2.1.1'
set -g @plugin 'christoomey/vim-tmux-navigator#master'
set -g @plugin 'tmux-plugins/tmux-yank#master'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

source-file ~/.config/tmux/options.conf
source-file ~/.config/tmux/keybindings.conf
source-file ~/.config/tmux/plugins.conf
source-file ~/.config/tmux/statusbar.conf
source-file ~/.config/tmux/style.conf

# Bootstrap TPM on first run, then initialize (keep at end)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
