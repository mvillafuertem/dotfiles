# bind -n M-L next-window
# bind -n M-J switch-client -p
# bind -n M-K switch-client -n

set -g prefix C-s
set -g mouse on
set -g history-limit 50000
set-option -gw xterm-keys on

# Vim style pane selection
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# C-b C-k to passthrough a C-k
# C-k is consumed for pane navigation but we want it for kill-to-eol
unbind C-k
bind C-k send-key C-k

set-option -g status-position top

# https://unix.stackexchange.com/questions/608268/how-can-i-force-tmux-to-sort-my-sessions-alphabetically
bind s choose-tree -Zs -O name
bind w choose-tree -Zw -O name

# prefix + v: conectar VPN — crea la sesión `vpn` si falta, corre el alias `vpn` allí
# y te lleva a esa sesión (para el SAML/sudo). Creds reales en ~/.config/openfortivpn.env
bind v run-shell "tmux has-session -t vpn 2>/dev/null || tmux new-session -d -s vpn; tmux send-keys -t vpn vpn Enter" \; switch-client -t vpn

# prefix + K: popup con buscador fuzzy (fzf, fallback skim) de contextos kube
# -> abre k9s --context <elegido> en ventana nueva. Solo si el script existe (hosts con k9s).
bind K if-shell -b "test -f ~/.config/tmux/k9s-context-menu.sh" \
  "display-popup -E -w 60% -h 40% -T \" k9s context \" \"bash ~/.config/tmux/k9s-context-menu.sh\""

# prefix + P: popup con buscador fuzzy (fzf, fallback skim) de proyectos en ~/gbg
# -> abre una ventana nueva ya en cd ~/gbg/<proyecto>. Solo si el script existe (hosts con fzf).
bind P if-shell -b "test -f ~/.config/tmux/project-picker.sh" \
  "display-popup -E -w 60% -h 60% -T \" projects \" \"bash ~/.config/tmux/project-picker.sh\""

# prefix + Tab: alternar con la última ventana visitada (last-window).
# La 'l' por defecto la usamos para nav de panel, así que va en Tab.
bind Tab last-window

set -g base-index 1 # start indexing windows at 1 instead of 0
setw -g pane-base-index 1 
set -g renumber-windows on # renumber all windows when any window is closed
#set-window-option -g pane-base-index 1
#set-option -g renumber-windows on


set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

