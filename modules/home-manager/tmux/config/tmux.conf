# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Configure Online
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?#{==:#{pane_synchronized},1},│,}"
# set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_green}]#{?#{==:#{pane_synchronized},1},  sync ,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?pane_synchronized,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_green}]#{?pane_synchronized,  sync ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}]#{?pane_in_mode,  copy ,}"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]#{?pane_in_mode,│,}"
# batería por nivel: rojo ≤10%, naranja <50%, verde ≥50%
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#{?#{e|>=:10,#{battery_percentage}},#[fg=#{@thm_red}],#{?#{e|>:50,#{battery_percentage}},#[fg=#{@thm_peach}],#[fg=#{@thm_green}]}} #{battery_icon} #{battery_percentage} ,}"
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#[fg=#{@thm_overlay_0}]#[none]│,}"
# VPN: 󰦝 (shield-check) verde si openfortivpn corre, 󰦞 (shield-off) gris si no
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#{?#{==:#(pgrep -x openfortivpn >/dev/null && echo on || echo off),on},#[fg=#{@thm_green}] 󰦝 vpn ,#[fg=#{@thm_overlay_0}] 󰦞 vpn },}"
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#[fg=#{@thm_overlay_0}]#[none]│,}"
# wifi: mismo formato que la VPN — icono fijo, verde si conectado (online_status ok), gris tenue si no
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_green}] 󰖩 wifi ,#[fg=#{@thm_overlay_0}] 󰖪 wifi },}"
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#[fg=#{@thm_overlay_0}]#[none]│,}"
set -ga status-right "#{?#{e|>=:#{client_width},100},#[bg=#{@thm_bg}]#[fg=#{@thm_lavender}] 󰭦 %Y-%m-%d 󰅐 %H:%M ,}"

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Configure Tmux
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_peach}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single
# setw -g pane-border-lines heavy
# set -g pane-border-lines number
# setw -g pane-border-indicators both

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{?#{m:*claude*,#{pane_current_command}},󱙺 claude,#{?#{m:*opencode*,#{pane_current_command}},󱙺 opencode,#{?#{m:*k9s*,#{pane_current_command}},󰠳 k9s, #{pane_current_command}}}}"

# notify on bell: marca con estilo rojo + icono 󰂚 las ventanas inactivas
# que emiten campana (\a). El flag se limpia al visitar la ventana.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off

# Inactivas: todas en peach (color que tenía la last-active). La last-active se
# distingue con el icono ⧉ tras el nombre (window_last_flag), no por color.
set -g window-status-format "#{?#{e|<:#{e|/:#{e|-:#{client_width},60},#{session_windows}},12}, #{=1:#{window_name}}#{?window_last_flag, ⧉,}#{?window_bell_flag, 󰂚,} , #I#{?#{!=:#{window_name},window},| #W,}#{?window_last_flag, ⧉,}#{?window_bell_flag, 󰂚,} }"
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format "#{?#{e|<:#{e|/:#{e|-:#{client_width},60},#{session_windows}},12}, #{=1:#{window_name}}#{?window_bell_flag, 󰂚,} , #I#{?#{!=:#{window_name},window},| #W,}#{?window_bell_flag, 󰂚,} }"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# https://dev.to/renuo/2-simple-configurations-to-supercharge-your-tmux-setup-5572
set-hook -g window-pane-changed 'select-layout -E'
set-hook -g client-resized 'select-layout -E'
set -g focus-events on
#set-hook -g pane-focus-out 'select-pane -P bg=#{@thm_peach},fg=colour0'
set-hook -g pane-focus-out 'select-pane -P "bg=#{@thm_surface_0}"'
set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'

