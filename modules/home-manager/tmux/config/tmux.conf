unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Force tmux to use the correct shell (NixOS/nix-darwin)
# default-shell / default-command are set from Nix (see tmux/default.nix)
# to ${pkgs.bashInteractive}/bin/bash so it points to the right /nix/store path
# regardless of the username (avoids hardcoding /etc/profiles/per-user/<user>).

# https://github.com/wez/wezterm/discussions/4680
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s set-clipboard external
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',*:clipboard:ccolour:cstyle:focus:title'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q' # this is for the cursor shape
set-option -sg escape-time 0
# Allow passthrough for WezTerm OSC sequences - use 'all' to allow from all panes
# Required so OSC 52 clipboard sequences emitted by TUI apps inside tmux
# (opencode, nvim, etc.) pass through tmux over SSH and reach WezTerm on the Mac,
# which then writes the selection to the macOS system clipboard (Cmd+V to paste).
# Without this, copy actions from those apps fail silently when running over SSH.
set -g allow-passthrough on

bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind  x  setw synchronize-panes

# Key Bindings - Pane Detach/Attach
# https://github.com/Piotr1215/dotfiles/blob/master/.tmux.conf
bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.1
bind-key S choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'

