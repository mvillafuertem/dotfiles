unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Key Bindings - Pane Detach/Attach
# https://github.com/Piotr1215/dotfiles/blob/master/.tmux.conf
# bind-key ! break-pane -d -n _hidden_pane
bind-key @ join-pane -s $.1
bind-key S choose-window 'join-pane -v -s "%%"'
bind-key V choose-window 'join-pane -h -s "%%"'

# unbind NPage
# unbind C-NPage
# unbind PPage
# unbind C-PPage
# bind -n PPage switch-client -p
# bind -n NPage switch-client -n

# Shift arrow to switch windows
# let's use wezterm for this behaviour
# https://wezfurlong.org/wezterm/config/lua/keyassignment/SendKey.html
# https://tangledhelix.com/posts/iterm2-keymaps-for-tmux/
# bind -n S-Left  previous-window
# bind -n S-Right next-window

# Toggle last active window
# bind l last-window

# dedicated escape sequences. modify key mappings terminal ^[[27;5;9~ and ^[[27;6;9~
bind -n C-Tab switch-client -n
bind -n C-S-Tab switch-client -p

# error when I try to use symbol like @ #
# Shift/Option Alt vim keys to switch windows
# https://superuser.com/questions/649960/option-key-does-not-work-as-meta-in-tmux
# bind -n M-H previous-window
# bind -n M-L next-window
# bind -n M-J switch-client -p
# bind -n M-K switch-client -n

set -g prefix C-s
set -g mouse on
set-option -gw xterm-keys on

# Vim style pane selection
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# https://unix.stackexchange.com/questions/608268/how-can-i-force-tmux-to-sort-my-sessions-alphabetically
bind s choose-tree -Zs -O name
bind w choose-tree -Zw -O name

set -g base-index 1 # start indexing windows at 1 instead of 0
setw -g pane-base-index 1 
set -g renumber-windows on # renumber all windows when any window is closed
#set-window-option -g pane-base-index 1
#set-option -g renumber-windows on

set -g @plugin 'tmux-plugins/tmp'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"

set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "test directory"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# set -g @catppuccin_pane_status_enabled "yes"
# set -g @catppuccin_pane_border_status "top"

run '~/.tmux/plugins/tpm/tpm'

# To modify how often the modules are updated
# set -g status-interval 1


# https://github.com/wez/wezterm/discussions/4680
# set -g default-terminal "tmux-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
set-option -sa terminal-features ',xterm-256color:RGB'
